[project]
name = "hatchguard"
version = "0.1.0"
description = "Learn AI engineering by building one secure AI assistant for a hatchery, milestone by milestone."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]          # real model calls (milestone 4 onwards, optional)
embed = ["sentence-transformers>=3.0"]   # real embeddings (milestone 5, optional)
mcp = ["mcp>=1.2"]                 # MCP server (milestone 6, optional)
track = ["mlflow>=2.12"]           # experiment tracking (milestone 2 and 10, optional)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# The starter files keep the imports you will need once you write the code.
"hatchguard/*.py" = ["F401", "F841"]
